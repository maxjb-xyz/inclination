name: Release images

# Build and publish the runtime images to the GitHub Container Registry (GHCR) so
# self-hosters can `docker compose up` and PULL them instead of building locally.
#
# Triggers on a version tag (e.g. `git tag v1.0.0 && git push --tags`) or manually.
# Publishes:
#   ghcr.io/<owner>/inclination-node:<version>  (+ :latest)   — api / sync / migrate
#   ghcr.io/<owner>/inclination-web:<version>   (+ :latest)   — caddy + SPA

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.0.0)"
        required: true
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: inclination-node
            dockerfile: infra/docker/node.Dockerfile
          - name: inclination-web
            dockerfile: infra/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; derive a lowercase owner namespace.
      - name: Compute image namespace
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single platform by default; add linux/arm64 here for multi-arch (slower).
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
