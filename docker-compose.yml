name: inclination

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data

  # One-shot: create the application bucket once MinIO is up. Not a gate dependency.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do echo 'waiting for minio'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET};
      echo 'bucket ready';
      "
    restart: "no"

  # One-shot: apply Prisma migrations, then exit. The API waits for this to succeed.
  # Reuses the image built by the `api` service (no own build to avoid a
  # concurrent same-tag export race in `docker compose build`).
  migrate:
    image: inclination-node:latest
    command: ["pnpm", "--filter", "@inclination/db", "run", "migrate:deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: inclination-node:latest
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    restart: unless-stopped
    command: ["node", "apps/api/dist/main.js"]
    environment:
      API_PORT: "3001"
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      # Browser-reachable endpoint presigned URLs are signed against (routed to
      # MinIO through Caddy). Defaults to the app origin so /inclination/* hits
      # the Caddy → MinIO route.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://localhost:8443}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      APP_BASE_URL: ${APP_BASE_URL:-https://localhost:8443}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost:8443}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      EMAIL_TOKEN_TTL: ${EMAIL_TOKEN_TTL:-86400}
      RESET_TOKEN_TTL: ${RESET_TOKEN_TTL:-3600}
      INVITE_TOKEN_TTL: ${INVITE_TOKEN_TTL:-604800}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-https://localhost:8443/api/auth/oidc/callback}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Inclination <no-reply@localhost>}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  sync:
    image: inclination-node:latest
    restart: unless-stopped
    command: ["node", "apps/sync/dist/main.js"]
    environment:
      SYNC_PORT: "3002"
      DATABASE_URL: ${DATABASE_URL}
      # Must match the API's signing secret: the sync server verifies the same
      # access tokens the API mints. Without this it falls back to the built-in
      # default and rejects every collab connection ("invalid signature").
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  caddy:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: inclination-web:latest
    restart: unless-stopped
    environment:
      # Site address Caddy serves; "localhost" for local/dev.
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      # Which TLS snippet the Caddyfile imports: "tls_internal" (self-signed,
      # for localhost) or "tls_auto" (Let's Encrypt for a real APP_DOMAIN).
      CADDY_TLS_SNIPPET: ${CADDY_TLS_SNIPPET:-tls_internal}
      # ACME contact email used when obtaining public certs (tls_auto only).
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports:
      # HTTP (also used by Caddy for the ACME http-01 challenge + HTTP->HTTPS
      # redirect when a real domain is configured).
      - "${CADDY_HTTP_PORT:-8080}:80"
      # HTTPS — the primary entrypoint.
      - "${CADDY_HTTPS_PORT:-8443}:443"
    depends_on:
      api:
        condition: service_healthy
      sync:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
